packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - "@solidjs/web@2.0.0-rc.14"
  - "@solidjs/signals@2.0.0-rc.14"
  - solid-js@2.0.0-rc.14
  - "@voidzero-dev/vite-plus-core@1.3.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.3.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.3.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.3.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.3.0"
  - vite-plus@1.3.0

overrides:
  # @effect/platform-node@4.0.1 depends on @effect/platform-node-shared with a
  # caret range, but the Effect 4 packages move in lockstep with `effect`
  # itself, which we pin exactly. A floating resolution (4.1.x) imports
  # internals that do not exist in effect@4.0.1, and `confect codegen` dies
  # with ERR_MODULE_NOT_FOUND on effect/dist/process/CommandLine.js.
  # Pin the sibling to the version that matches, so regenerating the lockfile
  # is safe.
  "@effect/platform-node-shared": 4.0.1
  electron-to-chromium: 1.5.445
  nanostores: 1.5.4
  # Route every `vite` resolution through Vite+'s bundled core so the app,
  # app and the Vite+ CLI run the exact same Vite build.
  vite@*: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest@*: 5.0.5
  vitest@workspace:*: 5.0.5
